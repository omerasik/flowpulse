name: FlowPulse CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: flowpulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flowpulse_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: flowpulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowpulse_ci -d flowpulse_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://flowpulse_ci:ephemeral-ci-only@127.0.0.1:5432/flowpulse_ci
      - run: npm run build
      - run: npm audit --audit-level=moderate
